name: Publish new release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'The workflow run ID to download artifacts from'
        required: true
        type: string
  workflow_run:
    workflows: [Build_Test_And_Publish, Build_Test_And_Publish_Quick]
    types: [completed]

permissions:
  packages: write
  contents: write
  actions: read
  id-token: write
  attestations: write
  issues: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set run ID
      id: set-run-id
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "RUN_ID=${{ github.event.inputs.run_id }}" >> $GITHUB_OUTPUT
          echo "Using manually provided run ID: ${{ github.event.inputs.run_id }}"
        else
          echo "RUN_ID=${{ github.event.workflow_run.id }}" >> $GITHUB_OUTPUT
          echo "Using workflow_run event run ID: ${{ github.event.workflow_run.id }}"
        fi
    - name: Download a Build Artifact
      uses: actions/download-artifact@v4.3.0
      with:
        github-token: ${{ github.token }}
        run-id: ${{ steps.set-run-id.outputs.RUN_ID }}
        pattern: "!*.dockerbuild"
    - name: Read tag info
      id: read-tag
      run: |
        TAG=$(cat tag-info/tag-info.txt)
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "Using release tag: $TAG"
    - name: Generate release notes
      id: release-notes
      env:
        TAG: ${{ steps.read-tag.outputs.tag }}
      run: |
        ANCESTOR_TAGS=$(git tag --merged "$TAG^")
        if [ -n "$ANCESTOR_TAGS" ]; then
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "$TAG^")
          RANGE="$PREVIOUS_TAG..$TAG"
          echo "Collecting release notes from $PREVIOUS_TAG to $TAG"
        else
          RANGE="$TAG"
          echo "No previous tag found; collecting release notes from repository history"
        fi

        NOTES=$(git log "$RANGE" --reverse \
          --format='%(trailers:key=Release-note,valueonly)' |
          awk 'NF && tolower($0) != "none" { print "- " $0 }')

        {
          echo "## What's Changed in $TAG"
          echo
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES"
          else
            echo "_No release notes provided in commit trailers._"
          fi
        } > release-notes.md

        echo "Generated release notes:"
        cat release-notes.md
    - uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.read-tag.outputs.tag }}
        name: ${{ steps.read-tag.outputs.tag }}
        prerelease: true
        body_path: release-notes.md
        files: |
          **/osx-x64/topaz-osx-x64
          **/osx-arm64/topaz-osx-arm64
          **/linux-x64/topaz-linux-x64
          **/linux-arm64/topaz-linux-arm64
          **/host-osx-x64/topaz-host-osx-x64
          **/host-osx-arm64/topaz-host-osx-arm64
          **/host-linux-x64/topaz-host-linux-x64
          **/host-linux-arm64/topaz-host-linux-arm64
          **/certificates/topaz.crt
          **/certificates/topaz.pfx
    - name: Copy artifacts for Docker
      run: |
        mkdir publish
        cp -a ./linux-x64/. publish/
        cp -a ./linux-arm64/. publish/
        cp -a ./host-linux-x64/. publish/
        cp -a ./host-linux-arm64/. publish/
    - name: Log in to Docker Hub
      uses: docker/login-action@v3.5.0
      with:
        username: thecloudtheory
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Set up Docker
      uses: docker/setup-docker-action@v4
      with:
        daemon-config: |
          {
            "debug": true,
            "features": {
              "containerd-snapshotter": true
            }
          }
    - name: Extract metadata for CLI Docker image
      id: meta
      uses: docker/metadata-action@v5.7.0
      with:
        images: thecloudtheory/topaz
        tags: |
          type=raw,value=${{ steps.read-tag.outputs.tag }}
          type=raw,value=latest
    - name: Build and push CLI Docker image
      id: push
      uses: docker/build-push-action@v6.18.0
      with:
        context: .
        file: ./Topaz.CLI/Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
    - name: Generate artifact attestation for CLI
      uses: actions/attest-build-provenance@v2
      with:
        subject-name: index.docker.io/thecloudtheory/topaz
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true
    - name: Extract metadata for Host Docker image
      id: meta-host
      uses: docker/metadata-action@v5.7.0
      with:
        images: thecloudtheory/topaz-host
        tags: |
          type=raw,value=${{ steps.read-tag.outputs.tag }}
          type=raw,value=latest
    - name: Build and push Host Docker image
      id: push-host
      uses: docker/build-push-action@v6.18.0
      with:
        context: .
        file: ./Topaz.Host/Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.meta-host.outputs.tags }}
        labels: ${{ steps.meta-host.outputs.labels }}
    - name: Generate artifact attestation for Host
      uses: actions/attest-build-provenance@v2
      with:
        subject-name: index.docker.io/thecloudtheory/topaz-host
        subject-digest: ${{ steps.push-host.outputs.digest }}
        push-to-registry: true
    - name: Trigger Homebrew formula update
      env:
        HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      run: |
        curl -s -X POST \
          -H "Authorization: token $HOMEBREW_TAP_TOKEN" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/TheCloudTheory/homebrew-topaz/dispatches \
          -d "{\"event_type\": \"new-release\", \"client_payload\": {\"tag\": \"${{ steps.read-tag.outputs.tag }}\"}}"
