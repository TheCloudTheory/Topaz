# ── Order Service ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: order-service:latest
          imagePullPolicy: Never   # image is imported via k3d, not pulled from a registry
          ports:
            - containerPort: 8080
          env:
            - name: AZURE_TENANT_ID
              value: "50717675-3E5E-4A1E-8CB5-C62D8BE8CA48"
            - name: TOPAZ_SUBSCRIPTION_ID
              value: "00000000-0000-0000-0000-000000000001"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: apps
spec:
  selector:
    app: order-service
  ports:
    - port: 80
      targetPort: 8080
---
